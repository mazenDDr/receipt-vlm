<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One receipt, start to finish · receipt-vlm</title>
<meta name="description" content="A single held-out receipt followed through the whole system: the photograph, the prompt, what the base model returned, what the fine-tuned model returned, how it was scored, and what the 4-bit build does with it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bed:#ECEEF1; --sheet:#FFFFFF; --sheet-2:#F4F6F9; --line:#DCE0E6; --line-soft:#E7EAEF;
  --ink:#171B21; --ink-2:#4A535F; --ink-3:#6B7480;
  --acc:#2D5BD6; --acc-soft:#E7EDFB;
  --ok:#2E7D4F; --ok-soft:#E3F1E8;
  --warn:#A9701C; --warn-soft:#FAF0DD;
  --bad:#C0392B; --bad-soft:#FBE9E6;
  --shadow:0 1px 2px rgba(23,27,33,.05),0 10px 26px rgba(23,27,33,.07);
  --sans:"Public Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --display:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bed:#101317; --sheet:#181C22; --sheet-2:#1E232B; --line:#2B313A; --line-soft:#232830;
    --ink:#E9ECF1; --ink-2:#AEB6C1; --ink-3:#818A96;
    --acc:#7FA3F0; --acc-soft:#1B2740; --ok:#6FBE8C; --ok-soft:#162C20;
    --warn:#D9A758; --warn-soft:#2C2416; --bad:#E58575; --bad-soft:#331F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bed:#101317; --sheet:#181C22; --sheet-2:#1E232B; --line:#2B313A; --line-soft:#232830;
  --ink:#E9ECF1; --ink-2:#AEB6C1; --ink-3:#818A96;
  --acc:#7FA3F0; --acc-soft:#1B2740; --ok:#6FBE8C; --ok-soft:#162C20;
  --warn:#D9A758; --warn-soft:#2C2416; --bad:#E58575; --bad-soft:#331F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bed);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}
a{color:var(--acc);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

.nav{position:sticky;top:0;z-index:20;background:var(--bed);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:600 17px/1 var(--display)}
.brand b{background:var(--ink);color:var(--bed);width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font:600 12px/1 var(--mono)}
.nav ul{display:flex;gap:2px;list-style:none;margin:0 0 0 auto;padding:0}
.nav a.nl{font:500 14px/1 var(--sans);color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:7px}
.nav a.nl:hover{background:var(--sheet);color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}

header.head{padding-block:44px 26px}
header.head h1{font-size:clamp(32px,5vw,52px);line-height:1.02;max-width:16ch}
.lede{margin:.8rem 0 0;max-width:64ch;color:var(--ink-2);font-size:17px}
.label{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* The rail: each step is a real stage, numbered because the order carries information. */
.step{display:grid;grid-template-columns:52px minmax(0,1fr);gap:20px;padding-block:26px;border-top:1px solid var(--line)}
@media (max-width:640px){.step{grid-template-columns:1fr;gap:10px}}
.step .n{font:600 13px/1 var(--mono);color:var(--acc);padding-top:5px;letter-spacing:.06em}
.step h2{font-size:23px;margin-bottom:.35rem}
.step p{margin:.4rem 0 0;max-width:62ch;color:var(--ink-2)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.panel.bad{border-color:var(--bad)}
.panel.ok{border-color:var(--ok)}
.panel h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.pill{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--sheet-2);color:var(--ink-3)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
pre{margin:0;font:400 12.2px/1.62 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
pre .k{color:var(--acc)} pre .r{color:var(--bad)} pre .g{color:var(--ok)} pre .d{color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.shot{max-width:320px}
.shot img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:var(--sheet-2)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:104px}
.stat b{display:block;font:600 16px/1.25 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.cmp th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.cmp td{padding:6px 8px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
table.cmp td.k{font:500 12px var(--mono);color:var(--ink-2)}
table.cmp td.v{font:400 12.5px var(--mono);overflow-wrap:anywhere}
.callout{border-left:3px solid var(--acc);background:var(--sheet);padding:12px 16px;border-radius:0 9px 9px 0;margin-top:16px}
footer{border-top:1px solid var(--line);padding-block:24px 44px;color:var(--ink-3);font-size:13.5px;margin-top:20px}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="../"><b>R</b> receipt-vlm</a>
  <ul>
    <li><a class="nl" href="../">Field guide</a></li>
    <li><a class="nl" href="../demo/">Recorded extractions</a></li>
    <li><a class="nl" href="https://github.com/mazenDDr/receipt-vlm">GitHub</a></li>
  </ul>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch theme">◐</button>
</div></nav>

<div class="wrap">
  <header class="head">
    <p class="label">The tour</p>
    <h1 id="t-title">One receipt, start to finish</h1>
    <p class="lede" id="t-lede"></p>
  </header>
</div>

<div class="wrap" id="steps"></div>

<footer><div class="wrap">
  Receipt from <a href="https://huggingface.co/datasets/naver-clova-ix/cord-v2">CORD v2</a>
  (Park et al., 2019), CC BY 4.0. Every figure on this page is read from the committed runs.
  <a href="https://github.com/mazenDDr/receipt-vlm">Source</a>.
</div></footer>

<script>
const STORY = /*__STORY__*/null;
(function () {
  const $ = (id) => document.getElementById(id);
  try {
    const saved = localStorage.getItem("rv-theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* private window */ }
  $("theme").addEventListener("click", () => {
    const now = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = now;
    try { localStorage.setItem("rv-theme", now); } catch (e) { /* ignore */ }
  });

  const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
  const S = STORY;

  $("t-lede").textContent =
    `Receipt ${S.example_id} from the held-out test split, followed through every stage exactly as it `
    + `was scored. Nothing here is illustrative: these are the recorded outputs.`;

  const stat = (b, s, color) =>
    `<div class="stat"><b${color ? ` style="color:${color}"` : ""}>${b}</b><span>${s}</span></div>`;

  const rowsTable = (rows) => `<div style="overflow-x:auto"><table class="cmp">
    <thead><tr><th>Key path</th><th>CORD label</th><th>Model</th></tr></thead><tbody>` +
    rows.map((r) => {
      const colour = r.agrees ? "var(--ok)" : (r.agrees_lenient ? "var(--warn)" : "var(--bad)");
      const pred = r.pred.length ? esc(r.pred.join(" · ")) : "not present";
      return `<tr><td class="k">${esc(r.path)}</td><td class="v">${esc(r.gold.join(" · ")) || "—"}</td>` +
        `<td class="v" style="color:${colour}">${pred}</td></tr>`;
    }).join("") + "</tbody></table></div>";

  const steps = [
    {
      n: "01",
      h: "The photograph",
      p: "A 900-pixel-wide photograph of a real till receipt. The model sees this and nothing else: no "
        + "OCR text, no layout boxes, no hints about which shop it came from.",
      html: `<div class="shot"><img src="../receipts/${S.example_id}.jpg" alt="Receipt ${S.example_id}"></div>`
        + `<div class="stats">${stat(S.width + "×" + S.height, "pixels")}`
        + `${stat(S.prompt_tokens, "prompt tokens")}${stat(S.n_gold_fields, "fields in the label")}</div>`,
    },
    {
      n: "02",
      h: "The prompt",
      p: "One instruction, identical for every receipt and every variant. It names each CORD key and "
        + "asks for the ones that are actually printed — nothing about formatting, which turns out to "
        + "be where a third of the remaining error lives.",
      html: `<div class="panel"><h3>Sent with the image <span class="pill acc">unchanged across all variants</span></h3>`
        + `<pre class="d">${esc(S.instruction)}</pre></div>`,
    },
    {
      n: "03",
      h: "What the base model returned",
      p: "Qwen2.5-VL-3B with no fine-tuning. It knows the schema — every key is there — but it fills "
        + "the blanks it cannot find, nests each item inside the one before it, and invents a total.",
      html: `<div class="panel bad"><h3>Base model <span class="pill bad">field F1 ${S.base.f1.toFixed(2)}</span>`
        + `<span class="pill">${S.base.tokens} tokens</span><span class="pill">${S.base.latency.toFixed(1)} s</span></h3>`
        + `<pre class="r">${esc(S.base.raw.slice(0, 900))}${S.base.raw.length > 900 ? "\n…" : ""}</pre></div>`,
    },
    {
      n: "04",
      h: "What the fine-tuned model returns",
      p: "The same image and the same prompt, after QLoRA fine-tuning on 773 receipts. It writes only "
        + "the fields that are on the paper, keeps the count in its own key, and stops.",
      html: `<div class="panel ok"><h3>Fine-tuned <span class="pill ok">field F1 ${S.ft.f1.toFixed(2)}</span>`
        + `<span class="pill">${S.ft.tokens} tokens</span><span class="pill">${S.ft.latency.toFixed(1)} s</span></h3>`
        + `<pre class="g">${esc(S.ft.raw)}</pre></div>`,
    },
    {
      n: "05",
      h: "How it is scored",
      p: "Both outputs are flattened into (key path, value) pairs and compared with the labels as "
        + "strings — Donut's rule, because digits are the point. Green agrees, amber differs only in "
        + "separators, red is a real difference.",
      html: rowsTable(S.ft.rows),
    },
    {
      n: "06",
      h: "And then it is quantized",
      p: "The adapter is merged into bf16 and quantized two ways. On this receipt both 4-bit builds "
        + "return the identical output — the same tokens, byte for byte — an order of magnitude faster.",
      html: `<div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Build</th><th>Field F1</th>`
        + `<th>Tokens</th><th>Latency</th><th>Same output as the fine-tune?</th></tr></thead><tbody>`
        + S.variants.map((v) => `<tr><td class="k">${esc(v.label)}</td><td>${v.f1.toFixed(3)}</td>`
          + `<td>${v.tokens}</td><td>${v.latency.toFixed(2)} s</td>`
          + `<td style="color:${v.identical ? "var(--ok)" : "var(--ink-3)"}">`
          + `${v.identical ? "identical" : "differs"}</td></tr>`).join("")
        + "</tbody></table></div>"
        + `<div class="callout">Across the whole test split the picture holds: AWQ differs from its bf16 `
        + `source by −0.005 [−0.026, +0.013] and GGUF Q4_K_M from its own reference by −0.014 `
        + `[−0.038, +0.009]. Neither difference is real. `
        + `<a href="../#quantize">Why that is, in the field guide.</a></div>`,
    },
  ];

  $("steps").innerHTML = steps.map((s) =>
    `<section class="step" id="s${s.n}"><div class="n">${s.n}</div><div>`
    + `<h2>${s.h}</h2><p>${s.p}</p>${s.html}</div></section>`).join("")
    + `<section class="step"><div class="n">→</div><div><h2>Every other receipt</h2>`
    + `<p>This was one of 100. The same view for all of them, filterable by what went wrong, is in the `
    + `<a href="../demo/">recorded extractions</a>.</p></div></section>`;
})();
</script>
</body>
</html>
