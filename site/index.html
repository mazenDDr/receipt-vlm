<style>
:root{
  --bed:#ECEEF1; --sheet:#FFFFFF; --sheet-2:#F4F6F9; --line:#DCE0E6; --line-soft:#E7EAEF;
  --ink:#171B21; --ink-2:#4A535F; --ink-3:#6B7480;
  --acc:#2D5BD6; --acc-soft:#E7EDFB;
  --ok:#2E7D4F; --ok-soft:#E3F1E8;
  --warn:#A9701C; --warn-soft:#FAF0DD;
  --bad:#C0392B; --bad-soft:#FBE9E6;
  --shadow:0 1px 2px rgba(23,27,33,.05),0 10px 26px rgba(23,27,33,.07);
  --sans:"Public Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --display:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bed:#101317; --sheet:#181C22; --sheet-2:#1E232B; --line:#2B313A; --line-soft:#232830;
    --ink:#E9ECF1; --ink-2:#AEB6C1; --ink-3:#818A96;
    --acc:#7FA3F0; --acc-soft:#1B2740; --ok:#6FBE8C; --ok-soft:#162C20;
    --warn:#D9A758; --warn-soft:#2C2416; --bad:#E58575; --bad-soft:#331F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bed:#101317; --sheet:#181C22; --sheet-2:#1E232B; --line:#2B313A; --line-soft:#232830;
  --ink:#E9ECF1; --ink-2:#AEB6C1; --ink-3:#818A96;
  --acc:#7FA3F0; --acc-soft:#1B2740; --ok:#6FBE8C; --ok-soft:#162C20;
  --warn:#D9A758; --warn-soft:#2C2416; --bad:#E58575; --bad-soft:#331F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bed);color:var(--ink);font:400 16px/1.68 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}
a{color:var(--acc);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
code{font:500 .86em var(--mono);background:var(--sheet-2);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

.nav{position:sticky;top:0;z-index:30;background:var(--bed);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:600 17px/1 var(--display)}
.brand b{background:var(--ink);color:var(--bed);width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font:600 12px/1 var(--mono)}
.nav ul{display:flex;gap:2px;list-style:none;margin:0 0 0 auto;padding:0}
.nav a.nl{font:500 14px/1 var(--sans);color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:7px}
.nav a.nl:hover{background:var(--sheet);color:var(--ink)}
@media (max-width:700px){.nav li.opt{display:none}}
.icon-btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}

/* The progress rail: a real sequence, so it is numbered. */
.rail{position:sticky;top:56px;z-index:25;background:var(--bed);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:9px;scrollbar-width:none}
.rail .wrap::-webkit-scrollbar{display:none}
.rail a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink-3);
  font:500 12.5px/1 var(--sans);padding:7px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.rail a:hover{background:var(--sheet);color:var(--ink)}
.rail a[aria-current="true"]{background:var(--sheet);border-color:var(--acc);color:var(--acc)}
.rail a i{font:600 10px/1 var(--mono);font-style:normal;opacity:.75}

header.head{padding-block:44px 8px}
header.head h1{font-size:clamp(32px,5vw,54px);line-height:1.02;max-width:16ch}
.lede{margin:.85rem 0 0;max-width:64ch;color:var(--ink-2);font-size:17.5px}
.label{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* Layout: the receipt stays beside the reader the whole way down. */
.stage{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:34px;align-items:start;padding-block:18px 40px}
@media (max-width:900px){.stage{grid-template-columns:1fr;gap:18px}}
.plate{position:sticky;top:118px}
@media (max-width:900px){.plate{position:static}}
.plate img{width:100%;border:1px solid var(--line);border-radius:9px;display:block;background:var(--sheet-2)}
.plate .cap{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.plate .rid{font:600 13px var(--mono)}
.plate .dim{color:var(--ink-3);font-size:12.5px}
.facts{display:grid;gap:6px;margin-top:12px}
.fact{display:flex;justify-content:space-between;gap:10px;background:var(--sheet);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:12.8px}
.fact span{color:var(--ink-3)}
.fact b{font:600 12.8px var(--mono);font-variant-numeric:tabular-nums}

section.step{border-top:1px solid var(--line);padding-block:30px}
section.step:first-child{border-top:0}
section.step .kicker{display:flex;align-items:center;gap:10px;margin-bottom:.45rem}
section.step .kicker i{font:600 11px/1 var(--mono);font-style:normal;color:var(--acc);letter-spacing:.08em}
section.step h2{font-size:25px}
section.step p{margin:.55rem 0 0;max-width:66ch;color:var(--ink-2)}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px;box-shadow:var(--shadow)}
.panel.bad{border-color:var(--bad)} .panel.ok{border-color:var(--ok)}
.panel h3{font-size:13.5px;margin-bottom:9px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--sheet-2);color:var(--ink-3)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
pre{margin:0;font:400 12.2px/1.62 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);max-height:340px;overflow-y:auto}
pre.r{color:var(--bad)} pre.g{color:var(--ok)}

/* The prompt, broken out rather than left as a blob. */
.prompt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:14px}
@media (max-width:760px){.prompt{grid-template-columns:1fr}}
.keys{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.keys code{font-size:11px;padding:2px 5px}

/* Token contrast drawn, not described. */
.bars{display:grid;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:132px minmax(0,1fr) 92px;gap:10px;align-items:center}
.bar .who{font:500 12.5px var(--sans);color:var(--ink-2)}
.bar .track{background:var(--sheet-2);border:1px solid var(--line-soft);border-radius:999px;height:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .6s ease}
.bar .val{font:600 12.5px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:640px){.bar{grid-template-columns:96px minmax(0,1fr) 78px}}

/* Variant switcher. */
.switch{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.switch button{font:500 12.5px var(--sans);padding:7px 12px;border:1px solid var(--line);background:var(--sheet);
  color:var(--ink-2);border-radius:8px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}

table.rows{width:100%;border-collapse:collapse;font-size:13.2px;margin-top:12px}
table.rows th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.rows td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.rows td.k{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
table.rows td.v{font:400 12.4px var(--mono);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* The scoring arithmetic, shown. */
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.sum{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.sum h4{margin:0 0 8px;font:600 12px var(--display);color:var(--ink-2)}
.sum .tri{display:flex;gap:14px;font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.sum .tri i{font-style:normal;display:block;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sum .frac{margin-top:10px;font:500 12.5px var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
.sum .out{margin-top:6px;font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tp{color:var(--ok)} .fp{color:var(--bad)} .fn{color:var(--warn)}

.callout{border-left:3px solid var(--acc);background:var(--sheet);padding:13px 16px;border-radius:0 9px 9px 0;margin-top:18px;max-width:72ch}
footer{border-top:1px solid var(--line);padding-block:26px 46px;color:var(--ink-3);font-size:13.5px}
</style>
</head>

      html: `<div class="panel bad"><h3>Base model`
        + `<span class="pill bad">field F1 ${S.counts.base.overall.f1.toFixed(2)}</span>`
        + `<span class="pill">${S.panels.base.tokens} tokens</span>`
        + `<span class="pill">${S.panels.base.latency.toFixed(1)} s</span></h3>`
        + `<pre class="r">${esc(S.base.raw)}</pre></div>`,
    },
    {
      id: "after", n: "04", t: "What fine-tuning changed",
      p: `Same image, same prompt, after QLoRA on 773 receipts. It writes only the fields on the paper, `
        + `keeps the count in its own key, and stops. Four times shorter, and every field correct.`,
      html: `<div class="panel ok"><h3>Fine-tuned`
        + `<span class="pill ok">field F1 ${S.counts.ft.overall.f1.toFixed(2)}</span>`
        + `<span class="pill">${S.panels.ft.tokens} tokens</span>`
        + `<span class="pill">${S.panels.ft.latency.toFixed(1)} s</span></h3>`
        + `<pre class="g">${esc(S.ft.raw)}</pre></div>`
        + `<div class="bars">`
        + bar("Base model", S.panels.base.tokens, maxTokens, "var(--bad)", " tokens")
        + bar("Fine-tuned", S.panels.ft.tokens, maxTokens, "var(--ok)", " tokens")
        + `</div>`,
    },
    {
      id: "score", n: "05", t: "How it is scored",
      p: `Both outputs are flattened into (key path, value) pairs and compared with the label as strings — `
        + `Donut's rule, because digits are the point. Every pair the model gets right is a true positive, `
        + `every pair it invents a false positive, every pair it misses a false negative. That is the whole `
        + `metric, and here it is on this receipt.`,
      html: `<div class="sums">${sumCard("Base model", S.counts.base.overall)}`
        + `${sumCard("Fine-tuned", S.counts.ft.overall)}</div>`
        + `<p style="margin-top:14px">Row by row, for the fine-tuned model. Green agrees, amber differs `
        + `only in separators, red is a real difference.</p>`
        + rowsTable(S.ft.rows)
        + `<div class="callout">Tree-edit accuracy, which also counts item order, moves the same way: `
        + `${S.counts.base.ted.toFixed(3)} → ${S.counts.ft.ted.toFixed(3)}. `
        + `The base model's ${S.base.rows.length} key paths against the fine-tune's ${S.ft.rows.length} `
        + `are mostly keys the receipt never had.</div>`,
    },
    {
      id: "quantize", n: "06", t: "And then it is quantized",
      p: `The adapter is merged into bf16 and quantized two ways. Switch between them: on this receipt `
        + `both 4-bit builds return the identical output — same tokens, byte for byte — an order of `
        + `magnitude faster.`,
      html: `<div class="switch" id="switch"></div><div id="variant-panel"></div>`
        + `<div class="bars" style="margin-top:16px">`
        + Object.values(S.panels).map((p) =>
            bar(p.label, p.latency, Math.max(...Object.values(S.panels).map((q) => q.latency)),
                p.label === "Base model" ? "var(--bad)" : "var(--acc)", " s")).join("")
        + `</div>`
        + `<div class="callout">Across the whole test split the picture holds: AWQ differs from its bf16 `
        + `source by −0.005 [−0.026, +0.013] and GGUF Q4_K_M from its own reference by −0.014 `
        + `[−0.038, +0.009]. Neither difference is real. `
        + `<a href="../#quantize">Why, in the field guide.</a></div>`,
    },
  ];

  $("steps").innerHTML = steps.map((s) =>
    `<section class="step" id="${s.id}"><div class="kicker"><i>${s.n}</i>`
    + `<h2>${s.t}</h2></div><p>${s.p}</p>${s.html}</section>`).join("")
    + `<section class="step"><div class="kicker"><i>→</i><h2>Every other receipt</h2></div>`
    + `<p>This was one of 100. The same view for all of them, filterable by what went wrong, is in the `
    + `<a href="../demo/">recorded extractions</a>.</p></section>`;

  // ---- the variant switcher ---------------------------------------------------------------------
  let shown = "ft";
  function renderVariant() {
    const order = ["base", "ft", "awq", "gguf"];
    $("switch").innerHTML = order.map((k) =>
      `<button type="button" data-k="${k}" aria-pressed="${k === shown}">${esc(S.panels[k].label)}</button>`
    ).join("");
    $("switch").querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => { shown = b.dataset.k; renderVariant(); }));
    const p = S.panels[shown];
    const c = S.counts[shown].overall;
    const identical = shown !== "base" && p.raw === S.panels.ft.raw;
    $("variant-panel").innerHTML =
      `<div class="panel ${c.f1 >= 0.9 ? "ok" : "bad"}"><h3>${esc(p.label)}`
      + `<span class="pill ${c.f1 >= 0.9 ? "ok" : "bad"}">field F1 ${c.f1.toFixed(3)}</span>`
      + `<span class="pill">${p.tokens} tokens</span>`
      + `<span class="pill">${p.latency.toFixed(2)} s</span>`
      + (identical ? `<span class="pill acc">byte-identical to the fine-tune</span>` : "")
      + `</h3><pre class="${c.f1 >= 0.9 ? "g" : "r"}">${esc(p.raw)}</pre>`
      + `<p style="font-size:13px;color:var(--ink-3);margin-top:10px">${esc(p.note)}</p></div>`;
  }
  renderVariant();

  // ---- the progress rail ------------------------------------------------------------------------
  $("rail").innerHTML = steps.map((s) =>
    `<a href="#${s.id}" data-id="${s.id}"><i>${s.n}</i>${s.t}</a>`).join("");
  const links = [...$("rail").querySelectorAll("a")];
  const seen = new Map();
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => seen.set(e.target.id, e.intersectionRatio));
    let best = null;
    seen.forEach((ratio, id) => { if (ratio > 0 && (!best || ratio > seen.get(best))) best = id; });
    links.forEach((a) => a.setAttribute("aria-current", String(a.dataset.id === best)));
  }, { rootMargin: "-120px 0px -55% 0px", threshold: [0, 0.25, 0.5, 1] });
  steps.forEach((s) => { const el = document.getElementById(s.id); if (el) io.observe(el); });
})();
</script>
</body>
</html>
