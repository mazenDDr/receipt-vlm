[project]
name = "receipt-vlm"
version = "0.1.0"
description = "QLoRA fine-tuning and quantization of Qwen2.5-VL-3B for receipt field extraction (CORD v2), with an evaluation harness"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "numpy>=1.26",
  "pillow>=10.0",
  "zss>=1.2",
]

[project.optional-dependencies]
# Already installed in the conda env "main" on the GPU machine; not needed on the Mac.
gpu = [
  "torch>=2.10",
  "transformers>=5.8",
  "peft>=0.19",
  "bitsandbytes>=0.49",
  "accelerate>=1.12",
  "datasets>=4.5",
  "qwen-vl-utils>=0.0.14",
  "trl>=0.28",
  "wandb>=0.25",
]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
